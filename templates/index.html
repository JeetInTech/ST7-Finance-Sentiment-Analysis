<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 Financial Sentiment Analysis 💰</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #a54caf, #2E8B57);
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: white;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            animation: fadeIn 2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        header {
            margin-bottom: 20px;
        }
        h1 {
            color: #ffcc00;
            animation: slideDown 1.5s ease-in-out;
            font-size: 2.5rem;
        }
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        p {
            color: #f1f1f1;
            font-size: 1.2rem;
        }
        button {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 22px;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.3s ease, transform 0.3s ease;
            animation: bounceIn 1.5s ease-in-out;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
        button:hover {
            background: linear-gradient(135deg, #ff512f, #dd2476);
            transform: scale(1.1);
        }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Financial Sentiment Analysis 💰</h1>
            <p>🔍 Understand market sentiment through AI-powered analysis.</p>
        </header>
        <main>
            <div class="content">
                <h2 style="color: #1900ff;">📢 Analyze Market Trends 📉📈</h2>
                <p>🚀 Gain insights into financial sentiment and make informed investment decisions.</p>
            </div>
            <button id="predict-btn">🔮 Predict Sentiment</button>
        </main>
    </div>
    <script>
        document.getElementById('predict-btn').addEventListener('click', function() {
            alert('📊 Sentiment analysis initiated!');
        });
    </script>
</body>
</html>
