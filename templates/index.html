
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Sentiment Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <script defer>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("predict-btn").addEventListener("click", function() {
                window.location.href = "/predict";
            });
        });
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .animated-title {
            font-size: 2.5em;
            animation: fadeIn 2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .info {
            margin: 20px auto;
            padding: 15px;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        #predict-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #predict-btn:hover {
            background: #ff2e63;
        }
        #result {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="animated-title">Finance Sentiment Analysis</h1>
    </header>
    
    <section class="info">
        <p>Understanding the market sentiment is crucial for making informed financial decisions. Sentiment analysis helps gauge investor emotions by analyzing financial news, social media, and stock trends.</p>
    </section>
    
    <button id="predict-btn">Predict Finance Sentiment</button>
    
    <div id="result"></div>
</body>
</html>
