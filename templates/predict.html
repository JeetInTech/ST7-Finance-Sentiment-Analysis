<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #2a2a2a;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
            resize: none;
        }
        button {
            background: #6200ea;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #3700b3;
        }
        .no-sentiment {
            background: #757575;
        }
        .no-sentiment:hover {
            background: #616161;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sentiment Analysis</h2>
        <form action="/predict" method="post">
            <textarea name="message" placeholder="Enter your message..."></textarea>
            <br>
            <button type="submit">Analyze Sentiment</button>
            <button type="button" class="no-sentiment">No Sentiment</button>
        </form>
    </div>
</body>
</html>
